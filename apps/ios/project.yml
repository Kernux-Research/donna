name: DonnaIOS
options:
  minimumXcodeGenVersion: 2.46.0
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1,2'
targets:
  DonnaIOS:
    type: application
    platform: iOS
    sources: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kernux.donna.ios
        GENERATE_INFOPLIST_FILE: 'YES'
        INFOPLIST_KEY_CFBundleDisplayName: Donna
    scheme:
      testTargets:
        - DonnaIOSUITests
  DonnaIOSUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: Tests
    dependencies:
      - target: DonnaIOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kernux.donna.ios.uitests
        GENERATE_INFOPLIST_FILE: 'YES'
